<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08060e" />
    <meta name="description" content="Juomapeli — suomenkielisiä haastekortteja peli-illan ryhmälle. Toimii selaimessa puhelimella ja tietokoneella." />

    <!-- Installed-app appearance on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juomapeli" />

    <!-- SVG first for modern browsers, .ico as the fallback -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Outfit for display/UI, Inter for card copy. Both cover Finnish diacritics. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <title>Juomapeli</title>

    <style>
      /* Painted before the bundle loads so the dark UI has no white flash. */
      html {
        background: #05040a;
      }
    </style>
  </head>
  <body>
    <noscript>Juomapeli tarvitsee JavaScriptin toimiakseen.</noscript>
    <div id="root"></div>
  </body>
</html>
